name: CI
on:
  push:
    branches: [main, "arena/65bc6e5a-attackpath-visualizer"]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux GUI build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Verify formatting
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "::error title=Go formatting::Unformatted files: $files"
            exit 1
          fi
      - name: Static analysis
        shell: bash
        run: go vet ./... || { echo "::error title=go vet::Static analysis failed; inspect this step's diagnostics"; exit 1; }
      - name: Unit and integration tests
        shell: bash
        run: go test -race ./... || { echo "::error title=Go tests::Tests failed; inspect this step's diagnostics"; exit 1; }
      - name: Native GUI build
        shell: bash
        run: go build -tags nogui ./... && go build ./...
      - name: Dependency vulnerability scan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./... || { echo "::error title=govulncheck::Dependency vulnerability scan failed"; exit 1; }
